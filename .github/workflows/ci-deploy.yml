name: Test and deploy Oracle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gongsi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Verify public source archive
        run: |
          python3 - <<'PY'
          import os, runpy, tempfile
          from pathlib import Path
          helper = runpy.run_path("deploy/fetch-release.py")
          sha = os.environ["GITHUB_SHA"]
          url = "https://codeload.github.com/jhkwon2002/Gongsi/tar.gz/" + sha
          with tempfile.TemporaryDirectory() as directory:
              helper["extract_archive"](helper["read_url"](url), Path(directory), sha)
          print("Verified exact commit source archive:", sha)
          PY
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem deploy -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $failures += @($parseErrors)
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
      - name: Check shell syntax
        run: bash -n deploy/bootstrap.sh && bash -n deploy/deploy.sh && bash -n deploy/prepare-memory.sh
      - name: Check automatic deployment systemd units
        run: |
          sudo install -d -m 0755 /opt/gongsi
          sudo ln -s "$(command -v python3)" /opt/gongsi/python3
          systemd-analyze verify --man=no deploy/gongsi-update.service deploy/gongsi-update.timer
